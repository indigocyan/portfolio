<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5be0"/>
      <stop offset=".55" stop-color="#0d2aa8"/>
      <stop offset="1" stop-color="#040c3a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".36" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dbe7ff"/>
      <stop offset="1" stop-color="#9fb6ef"/>
    </radialGradient>
    <!-- halftone screen for the moon's shadow side -->
    <pattern id="dots" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="1.6" cy="1.6" r=".95" fill="#2a4aa8"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".45" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <clipPath id="moonclip"><circle cx="28" cy="26" r="17"/></clipPath>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="28" cy="26" r="21" fill="#7fb0ff" opacity=".22"/>
    <circle cx="28" cy="26" r="17" fill="url(#moon)"/>
    <!-- craters -->
    <circle cx="22" cy="20" r="3.2" fill="#c3d2f5"/>
    <circle cx="31" cy="31" r="2.4" fill="#c3d2f5"/>
    <circle cx="20" cy="31" r="1.6" fill="#c3d2f5"/>
    <!-- shadow crescent with a halftone screen -->
    <g clip-path="url(#moonclip)">
      <circle cx="37" cy="33" r="17" fill="#8ea6e6"/>
      <circle cx="37" cy="33" r="17" fill="url(#dots)"/>
    </g>
    <!-- the menu cursor: white band under a red slash, pink tip -->
    <polygon points="-2,52 66,30 66,42 -2,62" fill="#ffffff"/>
    <polygon points="-2,46 66,22 66,31 -2,54" fill="#e5112b"/>
    <polygon points="54,17 59,14.5 57.2,23" fill="none" stroke="#ff5fae" stroke-width="1.3"/>
  </g>
</svg>
