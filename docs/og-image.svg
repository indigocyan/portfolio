<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview card. Source for og-image.png; text uses Archivo (extra-condensed black). -->
  <defs>
    <radialGradient id="sky" cx=".3" cy=".35" r=".95">
      <stop offset="0" stop-color="#2f62e6"/>
      <stop offset=".45" stop-color="#1032b4"/>
      <stop offset="1" stop-color="#030a30"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#9cc4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9cc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".36" cy=".34" r=".72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dae6ff"/>
      <stop offset="1" stop-color="#9db4ee"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="6" cy="6" r="2.7" fill="#3f5fbd"/>
    </pattern>
    <pattern id="dotsLight" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="5" cy="5" r="1.7" fill="#a9dcff" fill-opacity=".35"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff2ff"/>
      <stop offset=".6" stop-color="#3cd0ff"/>
      <stop offset="1" stop-color="#1aa6e8"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030a2a"/>
      <stop offset=".5" stop-color="#0d2163"/>
      <stop offset="1" stop-color="#030a2a"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".4" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="cornerDots"><rect width="1200" height="630" fill="url(#fadeR)"/></mask>
    <clipPath id="moonclip"><circle cx="320" cy="250" r="185"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- moon: halo, sphere, craters, halftone shadow crescent -->
  <circle cx="320" cy="250" r="270" fill="url(#halo)"/>
  <circle cx="320" cy="250" r="185" fill="url(#moon)"/>
  <circle cx="262" cy="190" r="30" fill="#c4d3f6"/>
  <circle cx="352" cy="300" r="22" fill="#c4d3f6"/>
  <circle cx="240" cy="300" r="14" fill="#c4d3f6"/>
  <circle cx="330" cy="160" r="11" fill="#c4d3f6"/>
  <g clip-path="url(#moonclip)">
    <circle cx="420" cy="330" r="190" fill="#a5b9ef"/>
    <circle cx="420" cy="330" r="190" fill="url(#dots)"/>
  </g>

  <!-- drifting cloud -->
  <ellipse cx="300" cy="420" rx="300" ry="34" fill="#dce8ff" opacity=".22" filter="url(#soft)"/>

  <!-- window frame in perspective, converging to the right -->
  <polygon points="96,0 124,0 118,630 88,630" fill="url(#frame)"/>
  <polygon points="470,0 494,0 490,630 466,630" fill="url(#frame)"/>
  <polygon points="790,0 810,0 808,630 788,630" fill="url(#frame)"/>
  <polygon points="0,372 1200,330 1200,350 0,398" fill="url(#frame)"/>
  <polygon points="96,0 104,0 98,630 88,630" fill="#5f8cff" opacity=".35"/>
  <polygon points="470,0 476,0 472,630 466,630" fill="#5f8cff" opacity=".35"/>

  <!-- halftone in the lower-right corner, as on the site -->
  <rect width="1200" height="630" fill="url(#dotsLight)" mask="url(#cornerDots)"/>

  <!-- name logo (right) -->
  <g font-family="Archivo" style="font-stretch:extra-condensed">
    <rect x="940" y="112" width="186" height="34" fill="#0a0a0a" transform="skewX(-14)"/>
    <text x="1005" y="137" font-size="24" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">PORTFOLIO</text>
    <text x="1140" y="290" font-size="170" font-weight="900" text-anchor="end" fill="none" stroke="#c8f2ff" stroke-width="5" letter-spacing="3">NIPUN</text>
    <rect x="636" y="312" width="560" height="104" fill="url(#bar)" transform="skewX(-8)"/>
    <text x="1124" y="394" font-size="84" font-weight="900" font-style="italic" text-anchor="end" fill="#071650" letter-spacing="2">MURLIDHARAN</text>
    <text x="1140" y="462" font-size="34" font-weight="700" font-style="italic" text-anchor="end" fill="#d9f6ff" letter-spacing="1">LOBA || IIT Tirupati</text>
  </g>

  <!-- the menu cursor: red slash over a white band, pink tip -->
  <polygon points="-20,560 760,470 760,520 -20,630" fill="#ffffff"/>
  <polygon points="-20,520 760,428 760,474 -20,575" fill="#e5112b"/>
</svg>
