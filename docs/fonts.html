<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typefaces</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    html, body { height: auto; }
    body { overflow: auto; user-select: auto; background: radial-gradient(120% 60% at 70% 0%, #2f6bff 0%, transparent 55%), linear-gradient(180deg, var(--sea), var(--deep) 40%, var(--abyss)); background-attachment: fixed; min-height: 100%; }
    body * { font-stretch: normal; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px var(--gut); background: rgba(2, 11, 58, .9); border-bottom: 2px solid var(--cyan); backdrop-filter: blur(6px); }
    header h1 { margin: 0; font-family: 'Nightswim Text'; font-weight: 700; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; }
    header label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; flex: 1; min-width: 220px; }
    header input { flex: 1; max-width: 360px; padding: 6px 10px; border: 0; background: var(--white); color: var(--ink); font: 600 15px 'Nightswim Text'; transform: skewX(var(--skew)); }
    header a { color: var(--cyan); font-weight: 600; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 28px; padding: 28px var(--gut) 60px; }
    .spec { position: relative; overflow: hidden; padding: 20px 22px 18px; background: rgba(2, 11, 58, .7); border: 1px solid rgba(143, 231, 255, .3); min-height: 330px; }
    .spec.current { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
    .spec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .spec-name { font-family: 'Nightswim Text'; font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
    .spec-note { font-family: 'Nightswim Text'; font-size: 13px; color: var(--foam); opacity: .8; }
    .giant-s { position: absolute; right: -.04em; bottom: -.16em; font-style: italic; font-weight: 900; font-size: 150px; line-height: .8; text-transform: uppercase; white-space: nowrap;
      color: rgba(216, 246, 255, .16); pointer-events: none; }
    .stack { position: relative; margin: 16px 0 0 10px; transform: rotate(-11deg); transform-origin: 0 50%; display: flex; flex-direction: column; align-items: flex-start; font-size: 50px; line-height: .88; }
    .w { position: relative; padding: 0 .18em; font-style: italic; font-weight: 900; text-transform: uppercase; color: var(--foam); text-shadow: .05em .05em 0 var(--deep); }
    .w:nth-child(2) { margin-left: .5em; } .w:nth-child(3) { margin-left: .25em; }
    .w.sel { color: var(--ink); text-shadow: none; }
    .w.sel::before { content: ''; position: absolute; z-index: -1; left: -.3em; right: -.5em; top: -.1em; bottom: -.08em; background: var(--red); clip-path: polygon(0 40%, 92% 0, 100% 64%, 8% 100%); transform: rotate(-4deg); }
    .w.sel::after { content: ''; position: absolute; z-index: -1; left: -.1em; right: -.25em; top: .1em; bottom: .02em; background: var(--white); clip-path: polygon(3% 18%, 100% 0, 96% 86%, 0 100%); }
    .row { display: flex; align-items: center; gap: 16px; margin-top: 46px; flex-wrap: wrap; position: relative; }
    .date { font-style: italic; font-weight: 900; font-size: 46px; line-height: 1; text-shadow: 3px 3px 0 var(--deep); }
    .tabs { display: flex; background: var(--white); color: #56648f; transform: skewX(var(--skew)); box-shadow: 4px 4px 0 var(--ink); }
    .tabs span { padding: .35em .8em; font-family: 'Nightswim Label'; font-style: italic; font-weight: 700; font-size: 15px; text-transform: uppercase; }
    .tabs .on { background: var(--ink); color: var(--white); box-shadow: inset 0 -3px 0 var(--red); }
    .use { position: relative; margin-top: 18px; display: inline-flex; padding: .35em 1em; background: var(--red); color: var(--white); text-decoration: none; transform: skewX(var(--skew));
      font-family: 'Nightswim Text'; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; box-shadow: 4px 4px 0 var(--ink); }
    .use:hover, .use:focus-visible { background: var(--white); color: var(--ink); }
    .current .use { background: var(--ink); }
    .pangram { margin: 14px 0 0; font-family: 'Nightswim Label'; font-style: italic; font-weight: 600; font-size: 20px; color: var(--cyan); position: relative; }
    .pair { margin-left: 8px; font-family: 'Nightswim Text'; font-size: 13px; color: var(--foam); }
  </style>
</head>
<body>
  <header>
    <h1>Typefaces</h1><span class="pair">Display face for titles and menus · labels in Nightswim Label, information text in Nightswim Text</span>
    <label>Preview <input id="txt" value="Profile" maxlength="18" aria-label="Preview word"></label>
    <a href="./">◀ Back to site</a>
  </header>
  <main id="grid"></main>
  <script type="module">
    import { FONTS, fontUrl, settings } from './js/util.js';
    const keys = Object.keys(FONTS);
    document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: fontUrl(keys) }));
    const grid = document.getElementById('grid');
    function draw(word) {
      grid.replaceChildren(...keys.map((k) => {
        const f = FONTS[k], el = document.createElement('section');
        el.className = 'spec' + (settings.font === k ? ' current' : '');
        el.style.fontFamily = `${f.family}, 'Arial Narrow', sans-serif`;
        el.style.setProperty('--fs', f.stretch || '100%');
        el.innerHTML = `
          <div class="giant-s" aria-hidden="true"></div>
          <div class="spec-head"><span class="spec-name"></span><span class="spec-note"></span></div>
          <div class="stack" aria-hidden="true"><span class="w"></span><span class="w sel"></span><span class="w">Calendar</span></div>
          <p class="pangram">Which entry do you want to view? Lunchtime · 0123456789</p>
          <div class="row"><span class="date">11/24</span><span class="tabs"><span>Skills</span><span class="on">Projects</span><span>Contact</span></span></div>
          <a class="use" href="./?font=${k}">${settings.font === k ? 'In use' : 'Use this font'}</a>`;
        el.querySelectorAll('*').forEach((n) => { if (f.stretch && !n.matches('.spec-name, .spec-note, .use')) n.style.fontStretch = f.stretch; });
        el.querySelector('.spec-name').textContent = f.name;
        el.querySelector('.spec-note').textContent = f.note;
        el.querySelector('.giant-s').textContent = word;
        const w = el.querySelectorAll('.w');
        w[0].textContent = 'Skills'; w[1].textContent = word;
        return el;
      }));
    }
    const txt = document.getElementById('txt');
    txt.addEventListener('input', () => draw(txt.value || 'Profile'));
    draw(txt.value);
  </script>
</body>
</html>
